[package]
name = "trojan"
version = "0.1.0"
edition = "2024"

[lib]
name = "trojan"
crate-type = ["cdylib", "rlib"]

[dependencies]
aex = { path = "aex" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"
socket2 = "0.6"
libc = "0.2"
anyhow = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql"], optional = true }
jni = { version = "0.21", features = ["default"] }

[features]
mysql = ["dep:sqlx"]
## Compile the JNI bridge on non-Android hosts too (for unit/JVM smoke tests).
jni-host = []
