[package]
name = "freewebmovement-trojan"
version = "0.1.0"
edition = "2024"
description = "An unidentifiable mechanism that helps you bypass GFW (trojan protocol, Rust implementation)"
license = "GPL-3.0"
repository = "https://github.com/Free-Web-Movement/trojan-rs"
readme = "README.md"
keywords = ["trojan", "proxy", "gfw", "bypass", "anonymous"]
categories = ["network-programming"]

[lib]
name = "trojan"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "trojan"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
aex = { version = "0.1.22", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"
socket2 = "0.6"
libc = "0.2"
anyhow = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql"], optional = true }
jni = { version = "0.21", features = ["default"] }

[features]
default = []
## Server side: aex transport and middleware chain.
server = ["dep:aex"]
## JNI bridge shipped with the library. The server half is additionally
## gated on `server`, so a protocol-only build still exposes JNI.
jni = []
mysql = ["dep:sqlx"]
## Compile the JNI bridge on non-Android hosts too (for unit/JVM smoke tests).
jni-host = ["jni"]

[workspace]
